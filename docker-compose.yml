version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: news-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: news-backend
    ports:
      - "8080:8080"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NEWS_API_KEY=${NEWS_API_KEY:-demo_key_replace_with_real}
      - JWT_SECRET=${JWT_SECRET:-9a4f2c8d3b7e1fa5c6d2b4f8a1e3d5c7b9f2a4d6e8c1b3f5a7d9e2c4b6f8a0d}
    depends_on:
      - redis
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: news-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  redis_data:
