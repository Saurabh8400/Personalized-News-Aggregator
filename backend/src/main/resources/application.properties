server.port=8080
server.servlet.context-path=/

# H2 Database
spring.datasource.url=jdbc:h2:mem:newsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true


# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=500ms
spring.data.redis.connect-timeout=500ms

# JWT Configuration
app.jwt.secret=${JWT_SECRET:bXlTdXBlclNlY3JldEtleUZvck5ld3NBZ2dyZWdhdG9yQXBwMTIzNDU2Nzg5MA==}
app.jwt.expiration=86400000

# NewsAPI Configuration
app.newsapi.key=${NEWS_API_KEY:demo_key_replace_with_real}
app.newsapi.base-url=https://newsapi.org/v2

# Rate Limiting
app.rate-limit.capacity=100
app.rate-limit.refill-tokens=100
app.rate-limit.refill-duration=60

# Cache TTL (seconds)
app.cache.news-ttl=600
app.cache.headlines-ttl=300

# CORS
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173

# Logging
logging.level.root=INFO
logging.level.com.newsagg=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n

# Error handling
server.error.include-message=always
server.error.include-stacktrace=on_param
server.error.include-exception=false
server.error.include-binding-errors=always
